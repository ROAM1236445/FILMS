<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Noah's Films</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #08080e;
  --surface: #111118;
  --surface2: #18181f;
  --surface3: #1e1e28;
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.12);
  --text: #ede9e0;
  --muted: #6b6878;
  --accent: #c8a84b;
  --accent2: rgba(200,168,75,0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar: 260px;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── LAYOUT ── */
.shell {
  display: grid;
  grid-template-columns: var(--sidebar) 1fr;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
aside {
  grid-row: 1 / -1;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.logo-wrap {
  padding: 1.75rem 1.5rem 1.25rem;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 24px;
  color: var(--accent);
  letter-spacing: 0.01em;
  line-height: 1;
}

.logo-sub {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-top: 4px;
}

.search-wrap {
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
}

.search-inner {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  transition: border-color 0.15s;
}

.search-inner:focus-within { border-color: var(--border2); }
.search-inner svg { flex-shrink: 0; opacity: 0.4; }

.search-inner input {
  background: none;
  border: none;
  outline: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 300;
  color: var(--text);
  width: 100%;
}

.search-inner input::placeholder { color: var(--muted); }

.stats {
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 1rem;
}

.stat {
  flex: 1;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  padding: 10px;
  text-align: center;
}

.stat-num {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--accent);
  line-height: 1;
}

.stat-lbl {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 3px;
}

.nav-section {
  padding: 1rem 1.5rem 0.5rem;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

.film-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 0.75rem 1rem;
}

.film-list-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.12s;
  border: 1px solid transparent;
}

.film-list-item:hover { background: var(--surface2); }
.film-list-item.active { background: var(--accent2); border-color: rgba(200,168,75,0.2); }

.fli-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--muted);
  opacity: 0.5;
}

.film-list-item.active .fli-dot { background: var(--accent); opacity: 1; }

.fli-name {
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.fli-size {
  font-size: 10px;
  color: var(--muted);
  flex-shrink: 0;
}

/* ── MAIN ── */
main {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

/* ── TOPBAR ── */
.topbar {
  padding: 1.25rem 2rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  position: sticky;
  top: 0;
  background: rgba(8,8,14,0.9);
  backdrop-filter: blur(10px);
  z-index: 10;
}

.view-label {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

.result-count { font-size: 11px; color: var(--accent); }

.sort-select {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  padding: 6px 10px;
  outline: none;
  cursor: pointer;
}

/* ── PLAYER ── */
#player-section {
  display: none;
  background: #000;
  border-bottom: 1px solid var(--border);
}

#player-section.open { display: block; }

#video {
  width: 100%;
  max-height: 65vh;
  display: block;
  background: #000;
}

.player-bar {
  padding: 12px 2rem;
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 1rem;
}

.now-playing {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  overflow: hidden;
}

.np-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  animation: blink 2s ease-in-out infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

.np-title {
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.close-btn {
  background: none;
  border: 1px solid var(--border2);
  color: var(--muted);
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: color 0.12s;
  flex-shrink: 0;
}

.close-btn:hover { color: var(--text); }

/* ── GRID ── */
.content {
  padding: 1.75rem 2rem;
  flex: 1;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  animation: up 0.3s ease both;
}

@keyframes up { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

.card:hover {
  transform: translateY(-5px);
  border-color: var(--border2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}

.card.active { border-color: var(--accent); }

.thumb {
  position: relative;
  aspect-ratio: 16/10;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.thumb-bg {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.thumb-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.18s;
  background: rgba(0,0,0,0.4);
}

.card:hover .thumb-overlay { opacity: 1; }

.play-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}

.ext-badge {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(0,0,0,0.7);
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.08em;
  padding: 3px 6px;
  border-radius: 4px;
  font-weight: 500;
}

.card-info {
  padding: 10px 12px 13px;
  border-top: 1px solid var(--border);
}

.card-name {
  font-size: 12px;
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  margin-bottom: 4px;
}

.card-meta { font-size: 11px; color: var(--muted); }

/* ── EMPTY / LOADING ── */
.state-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 5rem 2rem;
  text-align: center;
  gap: 1rem;
  color: var(--muted);
}

.state-box .icon { font-size: 48px; opacity: 0.2; }

.state-box h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--text);
  opacity: 0.5;
}

.state-box p { font-size: 13px; line-height: 1.6; max-width: 300px; }

.spinner {
  width: 28px;
  height: 28px;
  border: 2px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── MOBILE ── */
@media (max-width: 700px) {
  .shell { grid-template-columns: 1fr; }
  aside {
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
    grid-row: auto;
  }
  .film-list { max-height: 180px; }
  .topbar { padding: 1rem 1.25rem; }
  .content { padding: 1.25rem; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
}

/* ── TV big screen ── */
@media (min-width: 1800px) {
  :root { --sidebar: 300px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
}
</style>
</head>
<body>
<div class="shell">

  <!-- ── SIDEBAR ── -->
  <aside>
    <div class="logo-wrap">
      <div class="logo">Noah's Films</div>
      <div class="logo-sub">Family Library</div>
    </div>

    <div class="search-wrap">
      <div class="search-inner">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search" placeholder="Search films…" autocomplete="off" oninput="onSearch(this.value)" />
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-lbl">Films</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-size">—</div>
        <div class="stat-lbl">Total</div>
      </div>
    </div>

    <div class="nav-section">All films</div>
    <div class="film-list" id="film-list"></div>
  </aside>

  <!-- ── MAIN ── -->
  <main>
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="view-label">Library</span>
        <span class="result-count" id="result-count"></span>
      </div>
      <select class="sort-select" id="sort" onchange="applySort(this.value)">
        <option value="name">A → Z</option>
        <option value="name-desc">Z → A</option>
        <option value="size">Smallest first</option>
        <option value="size-desc">Largest first</option>
      </select>
    </div>

    <!-- Player -->
    <div id="player-section">
      <iframe id="video" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" sandbox="allow-same-origin allow-scripts allow-forms allow-popups" style="width:100%;height:65vh;border:none;background:#000;display:block;"></iframe>
      <div class="player-bar">
        <div class="now-playing">
          <div class="np-dot"></div>
          <div class="np-title" id="np-title">Now playing</div>
        </div>
        <button class="close-btn" onclick="closePlayer()">✕ Stop</button>
      </div>
    </div>

    <!-- Grid -->
    <div class="content">
      <div id="loading" class="state-box">
        <div class="spinner"></div>
        <p>Loading your library…</p>
      </div>
      <div id="empty" class="state-box" style="display:none">
        <div class="icon">🎬</div>
        <h2>No films found</h2>
        <p>No films have been added yet. Add films to main.py on your server.</p>
      </div>
      <div id="no-results" class="state-box" style="display:none">
        <div class="icon">🔍</div>
        <h2>No results</h2>
        <p>Try a different search term.</p>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </main>

</div>

<script>
const PALETTES = [
  ['#0d1f2d','#4a9eca'],['#1a0d2e','#9b72cf'],['#0d2318','#4aca8a'],
  ['#2e1a0d','#ca7a4a'],['#2e0d1a','#ca4a7a'],['#1a1a0d','#cac34a'],
  ['#0d2e2e','#4acaca'],['#2e200d','#ca9a4a'],['#1e0d2e','#7a4aca'],
  ['#0d2e1a','#4aca6a'],
];

let allFilms = [];
let filtered = [];
let activeId = null;

function loadFilms() {
  allFilms = [
    {
      name: "Five Nights at Freddy's 2",
      year: "2025",
      quality: "1080p",
      size: "1080p",
      ext: "MP4",
      filename: "1iF0CN_X61Z19yB08Rgc89KcsACJEUwJh",
    },
  ];
  filtered = [...allFilms];
  updateStats();
  renderAll();
  document.getElementById('loading').style.display = 'none';
}

function updateStats() {
  document.getElementById('stat-total').textContent = allFilms.length;
  document.getElementById('stat-size').textContent = allFilms.length ? '✓' : '0';
}

function applySort(mode) {
  if (mode === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name));
  else if (mode === 'name-desc') filtered.sort((a,b) => b.name.localeCompare(a.name));
  else if (mode === 'size') filtered.sort((a,b) => parseFloat(a.size) - parseFloat(b.size));
  else if (mode === 'size-desc') filtered.sort((a,b) => parseFloat(b.size) - parseFloat(a.size));
  renderGrid(filtered);
}

function onSearch(q) {
  const lower = q.toLowerCase().trim();
  filtered = lower
    ? allFilms.filter(f => f.name.toLowerCase().includes(lower))
    : [...allFilms];
  applySort(document.getElementById('sort').value);
  renderAll();
}

function renderAll() {
  renderSidebar(filtered);
  renderGrid(filtered);
}

function renderSidebar(list) {
  const el = document.getElementById('film-list');
  const count = document.getElementById('result-count');
  count.textContent = list.length !== allFilms.length ? `${list.length} of ${allFilms.length}` : `${allFilms.length} films`;

  el.innerHTML = list.map(f => `
    <div class="film-list-item ${f.filename === activeId ? 'active' : ''}" onclick="play('${esc(f.filename)}','${esc(f.name)}')">
      <div class="fli-dot"></div>
      <div class="fli-name">${esc(f.name)}</div>
      <div class="fli-size">${f.size}</div>
    </div>
  `).join('');
}

function renderGrid(list) {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const noResults = document.getElementById('no-results');

  if (allFilms.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'flex';
    noResults.style.display = 'none';
    return;
  }

  if (list.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'none';
    noResults.style.display = 'flex';
    return;
  }

  empty.style.display = 'none';
  noResults.style.display = 'none';

  grid.innerHTML = list.map((f, i) => {
    const pal = PALETTES[i % PALETTES.length];
    return `
    <div class="card ${f.filename === activeId ? 'active' : ''}" tabindex="0"
      onclick="play('${esc(f.filename)}','${esc(f.name)}')"
      onkeydown="if(event.key==='Enter')play('${esc(f.filename)}','${esc(f.name)}')"
      style="animation-delay:${Math.min(i * 0.035, 0.6)}s">
      <div class="thumb">
        <div class="thumb-bg" style="background:${pal[0]};width:100%;height:100%">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="${pal[1]}" stroke-width="0.8" opacity="0.5">
            <rect x="2" y="2" width="20" height="20" rx="2"/>
            <path d="M7 2v20M17 2v20M2 7h20M2 12h20M2 17h20"/>
          </svg>
        </div>
        <div class="thumb-overlay">
          <div class="play-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#08080e">
              <polygon points="5,3 19,12 5,21"/>
            </svg>
          </div>
        </div>
        <div class="ext-badge">${f.ext}</div>
      </div>
      <div class="card-info">
        <div class="card-name" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="card-meta">${f.year ? f.year + " · " : ""}${f.quality || f.size}</div>
      </div>
    </div>`;
  }).join('');
}

// ── Video URLs now point directly to /films/filename (static files on Wisby) ──
function play(filename, name) {
  activeId = filename;
  const section = document.getElementById('player-section');
  document.getElementById('np-title').textContent = name;
  window.open(`https://drive.google.com/file/d/${filename}/view`, '_blank');
  activeId = filename;
  renderSidebar(filtered);
  renderGrid(filtered);
}

function closePlayer() {
  const iframe = document.getElementById('video');
  iframe.src = '';
  document.getElementById('player-section').classList.remove('open');
  activeId = null;
  renderSidebar(filtered);
  renderGrid(filtered);
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePlayer();
  if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
    document.getElementById('search').focus();
    e.preventDefault();
  }
});

loadFilms();
</script>
</body>
</html>
